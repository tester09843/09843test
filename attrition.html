<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attrition - DVNKIDDLE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/media.css">
</head>
<body class="game-body attrition-mode">

  <div class="game-container">

    <a href="index.html" class="menu-btn back-to-menu">Main Menu</a>

    <h1 class="game-title attrition-title" style="margin-top: 20px;">ATTRITION</h1>

    <div class="guess-controls">
        <div id="waveIndicator" class="wave-counter-box wave-attrition">Wave: 1</div>
        <div class="search-container">
            <input type="text" id="enemyInput" placeholder="Type or select an enemy..." autocomplete="off">
            <div id="dropdownMenu" class="dropdown-menu"></div>
        </div>
        <button class="menu-btn submit-btn">Guess</button>
    </div>

    <div class="attrition-status-bar">
        <span id="poolCounter" class="pool-counter">Pool: — remaining</span>
        <span id="bountyIndicator" class="bounty-indicator" style="display:none;">⭐ BOUNTY TARGET</span>
        <span id="bountySwapIndicator" class="bounty-swap-indicator" style="display:none;"></span>
        <span id="runTimerDisplay" class="run-timer-display">⏱ 5:00</span>
    </div>

    <div class="perks-bar">
        <span class="perks-label">PERKS:</span>
        <div id="perksList" class="perks-list">
            <span id="perksNone" class="perk-tag perk-tag-none">None</span>
            <span id="reviveDisplay" class="revive-display perk-tag" style="display:none;"></span>
            <span id="overchargerDisplay" class="overcharger-display perk-tag" style="display:none;"></span>
            <button id="refillBtn" class="refill-btn perk-tag" style="display:none;" title="Click to refill your guesses"><img class="perk-icon" src="images/icons/refill.png" alt=""> Refill</button>
            <button id="resetTimerBtn" class="reset-timer-btn perk-tag" style="display:none;"><img class="perk-icon" src="images/icons/reset-timer.png" alt=""> Reset Timer</button>
        </div>
    </div>

    <div class="modifiers-container">
        <span class="modifiers-label">MODIFIERS:</span>
        <div id="modifiersList" class="modifiers-list">
            <span class="modifier-tag modifier-tag-none">None</span>
        </div>
    </div>
    <div id="modifierDescription" class="modifier-description" style="display: none;"></div>

    <div class="action-panel">
        <button id="continueButton" class="menu-btn continue-btn" style="display: none;" onclick="advanceNextWave()">Continue</button>
    </div>

    <div id="gameMessage" class="game-message"></div>

    <table class="wordle-table" id="guessTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Type</th>
                <th>Health</th>
                <th>Total Waves</th>
                <th>First Encounter</th>
            </tr>
        </thead>
        <tbody id="guessRows">
        </tbody>
    </table>

  </div>

  <script src="modifiers.js"></script>
  <script src="modifiersattrition.js"></script>
  <script src="attrition.js"></script>

</body>
</html>
